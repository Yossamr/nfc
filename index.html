    <!-- Tailwind is usually injected via PostCSS in local dev, but keeping CDN for simplicity/fallback is okay. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-bg: rgba(15, 23, 42, 0.6);
        --neon-blue: #3b82f6;
        --neon-purple: #8b5cf6;
      }

      body {
        font-family: 'Cairo', sans-serif;
        background-color: #020617; /* Deep Void */
        color: #f8fafc;
        overflow-x: hidden;
        /* Animated Background Mesh */
        background-image: 
          radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
        background-attachment: fixed;
      }

      /* Modern Glass Class */
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }

      /* Custom Slim Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(71, 85, 105, 0.5); 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.8); 
      }

      /* PDF Generation Container Styles */
      #pdf-hidden-container {
        position: absolute;
        left: -9999px;
        top: 0;
        width: 210mm; /* A4 width */
        min-height: 297mm;
        background-color: white !important;
        color: black !important;
        padding: 20px 40px;
        box-sizing: border-box;
        font-family: 'Cairo', sans-serif !important;
        z-index: -1;
      }

      #pdf-hidden-container * {
        color: black !important;
        border-color: #000 !important;
      }

      #pdf-hidden-container table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        font-size: 12px;
      }

      #pdf-hidden-container th {
        background-color: #f3f4f6 !important; /* Light Gray */
        font-weight: 800;
        text-align: right;
        border: 2px solid #000;
        padding: 8px;
        -webkit-print-color-adjust: exact;
      }

      #pdf-hidden-container td {
        border: 1px solid #666;
        padding: 8px;
        font-weight: 600;
      }
      
      #pdf-hidden-container tr:nth-child(even) {
        background-color: #f9fafb !important;
        -webkit-print-color-adjust: exact;
      }

      /* Header Style in PDF */
      .pdf-header {
        border-bottom: 3px solid #000;
        padding-bottom: 10px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      /* Utilities */
      .text-glow { text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
